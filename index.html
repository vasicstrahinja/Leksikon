<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moj leksikon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@500;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: razigrano, toplo, kao spomenar iz osnovne škole
   IDEA: tvrdo ukoričeni leksikon — korice od maline, linirane stranice s crvenom marginom
   PICTURE: otvorena stranica bilježnice sa spiralom i trakom; forma i odgovori žive na njoj
   COLOUR and TYPE: malina #c2185b korice, papir bijeli s plavim linijama, žuta traka #ffd23f; Baloo 2 + Caveat za rukopis + Nunito
   LAYOUT: jedna kolona, stranica 760px, tabovi iznad; na mobitelu puna širina */
:root{color-scheme:light dark;
 --cover:light-dark(#c2185b,#5a0f33);--cover2:light-dark(#a3124b,#430a26);
 --paper:light-dark(#fffefb,#1f1c24);--line:light-dark(#cfe0f5,#2f3446);--margin:light-dark(#f2a3a3,#7a3446);
 --ink:light-dark(#1c2340,#ece9f2);--soft:light-dark(#5b6280,#a9a6b8);--hand:light-dark(#1a3fa0,#9ec1ff);
 --tape:light-dark(#ffd23f,#d9ad1e);--accent:light-dark(#c2185b,#ff6fa5);--field:light-dark(#fff,#272330)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;
 background:var(--cover) radial-gradient(circle at 20% 10%,rgba(255,255,255,.12) 0 2px,transparent 3px) 0 0/26px 26px}
.wrap{max-width:780px;margin:0 auto;padding:clamp(20px,4vw,48px) max(3vw,12px) 64px}
header{color:#fff;text-align:center;margin-bottom:22px}
h1{font:800 clamp(34px,7vw,52px)/1.05 "Baloo 2",sans-serif;margin:0;text-wrap:balance;text-shadow:0 3px 0 var(--cover2)}
header p{margin:6px 0 0;opacity:.9}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:-6px;position:relative;z-index:1}
.tabs button{font:700 16px "Baloo 2",sans-serif;border:0;border-radius:12px 12px 0 0;padding:10px 18px 14px;min-height:44px;
 background:var(--cover2);color:#fff;cursor:pointer;opacity:.85}
.tabs button[aria-selected=true]{background:var(--paper);color:var(--accent);opacity:1}
.page{position:relative;background:var(--paper);border-radius:6px 14px 14px 6px;box-shadow:0 18px 40px rgba(0,0,0,.28),0 2px 0 rgba(0,0,0,.08);
 padding:44px clamp(18px,4vw,40px) 40px clamp(56px,9vw,84px);
 background-image:linear-gradient(90deg,transparent calc(clamp(44px,7.5vw,70px)),var(--margin) calc(clamp(44px,7.5vw,70px)) calc(clamp(44px,7.5vw,70px) + 2px),transparent 0),
 repeating-linear-gradient(var(--paper) 0 31px,var(--line) 31px 32px)}
.page::before{content:"";position:absolute;left:10px;top:24px;bottom:24px;width:22px;
 background:radial-gradient(circle at 11px 11px,var(--cover2) 0 6px,transparent 7px) 0 0/22px 34px}
.tape{position:absolute;top:-14px;right:28px;width:120px;height:30px;background:var(--tape);opacity:.9;transform:rotate(4deg);box-shadow:0 2px 4px rgba(0,0,0,.15)}
h2{font:700 30px/1.1 "Baloo 2",sans-serif;margin:0 0 4px;color:var(--accent)}
.sub{color:var(--soft);margin:0 0 22px}
.q{margin:0 0 20px}
.q label{display:block;font-weight:700;margin-bottom:4px}
.q .req{color:var(--accent)}
input,textarea,select{width:100%;font:500 22px/1.3 Caveat,cursive;color:var(--hand);background:var(--field);
 border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{font:600 15px Nunito;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;min-height:44px;border:2px solid var(--line);border-radius:999px;background:var(--field);cursor:pointer;margin:0}
.chips input{width:auto;min-height:0;accent-color:var(--accent)}
.chips label:has(input:checked){border-color:var(--accent);color:var(--accent)}
.btn{font:700 17px "Baloo 2",sans-serif;border:0;border-radius:12px;padding:10px 22px;min-height:46px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--cover2)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{min-height:24px;margin-top:12px;font-weight:700}
.msg.ok{color:#2e8b57}.msg.err{color:#d23a3a}
.lock{text-align:center;padding:20px 0}
.lock svg{width:110px;height:110px;margin:0 auto 10px;display:block}
.lock .row{justify-content:center;margin-top:14px}
.lock input{max-width:260px;text-align:center;font-size:28px;letter-spacing:2px}
.qpage .qtitle{font:800 clamp(28px,6vw,40px)/1.1 "Baloo 2",sans-serif;color:var(--accent);margin:0 0 18px;text-wrap:balance;text-align:center}
.qpage ol{list-style:none;margin:0;padding:0}
.qpage li{display:grid;grid-template-columns:2.4em minmax(0,1fr);align-items:baseline;min-height:48px;border-bottom:1px solid var(--line);padding:6px 0}
.qpage .n{font:700 18px "Baloo 2",sans-serif;color:var(--soft)}
.qpage .a{font:500 25px/1.25 Caveat,cursive;white-space:pre-wrap;overflow-wrap:anywhere}
.qpage .f1{font-family:Kalam,cursive;font-size:20px}.qpage .f2{font-family:"Patrick Hand",cursive;font-size:21px}
.c0{color:light-dark(#1a3fa0,#9ec1ff)}.c1{color:light-dark(#1f7a4a,#7fe0a8)}.c2{color:light-dark(#7a2fb0,#d6a8ff)}.c3{color:light-dark(#c0392b,#ff9a8a)}.c4{color:light-dark(#0b7285,#7fd8e6)}.c5{color:light-dark(#9c4a00,#ffb870)}
.qpage li.mine{border-bottom:2px dashed var(--accent)}
.ans{display:flex;gap:8px;align-items:center}
.ans .a{flex:1;width:auto;min-height:44px;border:0;border-radius:6px;background:light-dark(rgba(255,210,63,.18),rgba(255,210,63,.08));padding:4px 8px;line-height:1.25}
.ans textarea.a{min-height:64px;resize:vertical}
.ans select.a{font-family:Nunito,sans-serif;font-size:17px}
.ans .ok{flex:none;font:700 15px "Baloo 2",sans-serif;border:0;border-radius:10px;background:var(--accent);color:#fff;min-height:44px;padding:0 14px;cursor:pointer}
.thanks{text-align:center}.thanks img{display:block;width:100%;max-width:560px;height:auto;margin:6px auto 0;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.qnum{text-align:center;color:var(--soft);font-weight:700;margin-top:18px}
.jump{display:flex;gap:8px;align-items:center;margin-bottom:22px}.jump select{font:600 16px Nunito,system-ui,sans-serif;color:var(--ink)}
.ulist{list-style:none;padding:0;margin:0}.ulist li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px}
.pager span{color:var(--soft);font-weight:700;white-space:nowrap}.pager .btn{white-space:nowrap;padding:10px 16px}
.empty{text-align:center;color:var(--soft);padding:30px 0}
fieldset{border:2px dashed var(--line);border-radius:12px;padding:16px;margin:0 0 20px}
legend{font:700 18px "Baloo 2";color:var(--accent);padding:0 6px}
pre{background:var(--field);border:2px solid var(--line);border-radius:10px;padding:10px;font-size:13px;overflow-x:auto;white-space:pre}
.small{font-size:14px;color:var(--soft)}
.del{font:600 13px Nunito;background:none;border:0;color:#d23a3a;cursor:pointer;text-decoration:underline;min-height:40px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:no-preference){.page{animation:in .35s ease-out}@keyframes in{from{transform:translateY(10px) rotate(-.6deg);opacity:0}}}
@media(max-width:600px){.page::before{left:4px}.tape{width:80px;right:14px}}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <h1>Moj leksikon</h1>
 </header>

 <main class="page" id="page">

  <section id="vLock" class="lock">
   <svg viewBox="0 0 120 120" aria-hidden="true"><rect x="22" y="52" width="76" height="58" rx="12" fill="var(--tape)"/><rect x="22" y="52" width="76" height="14" rx="6" fill="rgba(255,255,255,.35)"/><path d="M38 54V40a22 22 0 0 1 44 0v14" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round"/><circle cx="60" cy="78" r="8" fill="var(--cover2)"/><rect x="56" y="80" width="8" height="16" rx="3" fill="var(--cover2)"/></svg>
   <h2>Leksikon je zaključan</h2>
   <p class="sub">Unesi šifru koju si dobio/la da otvoriš stranice.</p>
   <form id="lockForm">
    <input id="pass" type="password" autocomplete="off" aria-label="Šifra" placeholder="šifra">
    <div class="row"><button class="btn" type="submit">Otključaj</button></div>
   </form>
   <div class="msg" id="lockMsg"></div>
  </section>

  <section id="vListaj" hidden>
   <div class="jump"><label for="jumpSel" class="small" style="flex:none">Idi na</label><select id="jumpSel"></select></div>
   <article class="qpage" id="qpage"></article>
   <div class="msg" id="ansMsg" style="text-align:center"></div>
   <div class="pager" id="pager"></div>
  </section>

 </main>
 <p class="small" style="color:#fff;opacity:.8;text-align:center;margin-top:18px" id="foot"></p>
</div>

<script src="config.js"></script>
<script>
{
const API=(window.LEKSIKON_API||'').trim();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};
let done=store.get('lx_done')==='1',questions=[],entries=[],mine=-1,idx=0,unlocked=false,saving=false,pass=store.get('lx_pass')||'';
let myId=store.get('lx_id');
if(!myId){const a=new Uint8Array(16);crypto.getRandomValues(a);myId=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');store.set('lx_id',myId)}

function parseCsv(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const d=(first.split(';').length>=first.split(',').length)?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==d){row.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&text[i+1]=='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  const out=[];
  rows.forEach((r,i)=>{let p=(r[0]||'').trim().replace(/\*$/,'').trim();if(!p)return;
    if(i==0&&/^(pitanje|question)$/i.test(p))return;
    let tip=(r[1]||'kratko').trim().toLowerCase();if(!['kratko','dugo','broj','datum','izbor'].includes(tip))tip='kratko';
    const opcije=(r[2]||'').split('|').map(s=>s.trim()).filter(Boolean);
    if(tip=='izbor'&&!opcije.length)tip='kratko';
    out.push({p,tip,opcije})});
  return out;
}

async function call(body){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,pass})});
  return r.json();
}
async function load(){
  const r=await call({action:'list',id:myId});
  if(!r.ok)throw r;
  entries=r.entries||[];mine=r.mine??-1;
}

function lockMsg(t){$('lockMsg').className='msg err';$('lockMsg').textContent=t}
async function tryUnlock(p){
  pass=p.trim();
  try{await load()}catch(e){if(e&&e.err=='sifra'){lockMsg(p?'Pogrešna šifra, pokušaj ponovo.':'');return false}lockMsg('Ne mogu da dođem do leksikona. Proveri internet i pokušaj ponovo.');return false}
  store.set('lx_pass',pass);unlocked=true;$('vLock').hidden=true;$('vListaj').hidden=false;renderList();return true;
}
$('lockForm').addEventListener('submit',e=>{e.preventDefault();tryUnlock($('pass').value)});

function myField(q,v,cls){
  if(q.tip=='dugo')return `<textarea id="ansIn" class="${cls}" rows="2" aria-label="Tvoj odgovor">${esc(v)}</textarea>`;
  if(q.tip=='izbor')return `<select id="ansIn" class="${cls}" aria-label="Tvoj odgovor"><option value="">izaberi…</option>${q.opcije.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  return `<input id="ansIn" class="${cls}" type="${q.tip=='broj'?'number':q.tip=='datum'?'date':'text'}" value="${esc(v)}" aria-label="Tvoj odgovor" placeholder="tvoj odgovor…" autocomplete="off">`;
}
const val=(en,q)=>String((en&&en[q.p])??'');
function renderList(focus){
  const n=questions.length;
  if(!n){$('qpage').innerHTML='<p class="empty">Nema pitanja.</p>';return}
  idx=Math.max(0,Math.min(idx,n));
  $('jumpSel').innerHTML=questions.map((x,i)=>`<option value="${i}" ${i==idx?'selected':''}>${i+1}. ${esc(x.p)}</option>`).join('')+(idx==n?'<option selected disabled>Kraj</option>':'');
  if(idx===n){$('qpage').innerHTML='<div class="thanks"><img src="macka.png" alt="Mačka pored table na kojoj piše Thank you!"></div>';
    $('pager').innerHTML='<button class="btn ghost" type="button" data-step="-1">← Nazad</button><span></span><span></span>';$('ansMsg').textContent='';return}
  const q=questions[idx];
  const me=done?-1:(mine<0?entries.length:mine);
  const row=(i,en)=>{const cls=`a c${i%6} f${i%3}`;
    if(i===me)return `<li class="mine"><span class="n">${i+1}.</span><form class="ans" id="ansForm">${myField(q,val(en,q),cls)}<button class="ok" type="submit">Upiši</button></form></li>`;
    return `<li><span class="n">${i+1}.</span><span class="${cls}">${esc(val(en,q))}</span></li>`};
  let rows=entries.map((en,i)=>row(i,en)).join('');
  if(mine<0&&!done)rows+=row(entries.length,null);
  $('qpage').innerHTML=`<p class="qtitle">${esc(q.p)}</p><ol>${rows}</ol>`;
  $('pager').innerHTML=`<button class="btn ghost" type="button" data-step="-1" ${idx==0?'disabled':''}>← Nazad</button><span>${idx+1} / ${n}</span><button class="btn ghost" type="button" data-step="1" ${idx>=n?'disabled':''}>Dalje →</button>`;
  if(focus&&$('ansIn'))$('ansIn').focus({preventScroll:true});
}

async function saveCurrent(){
  const f=$('ansIn');if(!f)return true;
  const q=questions[idx],o=f.value.trim(),old=val(mine<0?null:entries[mine],q);
  if(o===old)return true;
  const m=$('ansMsg');saving=true;m.className='msg';m.textContent='Upisujem…';
  try{const r=await call({action:'save',id:myId,p:q.p,o});
    if(!r.ok)throw r;
    if(mine<0){entries.push({});mine=entries.length-1}
    entries[mine]={...entries[mine],[q.p]:o};
    m.className='msg ok';m.textContent='Upisano.';return true}
  catch(e){m.className='msg err';m.textContent=e&&e.err=='sifra'?'Šifra je promenjena. Osveži stranicu i unesi novu.':'Nije uspelo, pokušaj ponovo.';return false}
  finally{saving=false}
}
async function go(k,focus){
  if(saving)return;if(!(await saveCurrent()))return;
  if(k<0||k>questions.length){renderList();return}
  if(k===questions.length&&!done){done=true;store.set('lx_done','1')}
  idx=k;renderList(focus);if(!focus)$('page').scrollIntoView({behavior:'smooth',block:'start'});
}
$('qpage').addEventListener('submit',async e=>{e.preventDefault();await go(idx+1,idx+1<questions.length)});
$('pager').addEventListener('click',e=>{const t=e.target.closest('button[data-step]');if(t)go(idx+ +t.dataset.step)});
$('jumpSel').addEventListener('change',e=>go(+e.target.value));
{let x0=null;$('qpage').addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
 $('qpage').addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60){const k=idx+(dx<0?1:-1);if(k>=0&&k<=questions.length)go(k)}})}

setInterval(async()=>{
  if(!unlocked||saving||document.hidden||document.activeElement?.closest('#ansForm'))return;
  try{await load();if(!saving&&!document.activeElement?.closest('#ansForm'))renderList()}catch(_){}
},20000);

(async()=>{
  try{questions=parseCsv(await (await fetch('pitanja.csv',{cache:'no-store'})).text())}catch(_){questions=[]}
  if(!API){$('vLock').hidden=true;$('foot').textContent='';$('page').insertAdjacentHTML('beforeend','<p class="empty">Leksikon još nije povezan sa Google tabelom. U config.js upiši adresu Apps Script-a (uputstvo je u README.md).</p>');return}
  if(pass&&await tryUnlock(pass))return;
  $('lockMsg').textContent='';
})();

}
</script>
</body>
</html>
